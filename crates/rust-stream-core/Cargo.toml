[package]
name = "rust-stream-core"
description = "Reusable four-slot IP video source manager for Rust-Boy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
url = "2"

[features]
default = []
native-video = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies.gstreamer]
version = "0.24"
optional = true

[dependencies.gstreamer-app]
version = "0.24"
optional = true
