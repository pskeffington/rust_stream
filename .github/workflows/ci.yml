name: Rust Stream CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check -p rust-stream-core
      - run: cargo test -p rust-stream-core
      - run: cargo clippy -p rust-stream-core --all-targets -- -D warnings
